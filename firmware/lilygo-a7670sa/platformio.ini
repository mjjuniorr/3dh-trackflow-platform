[platformio]
default_envs = lilygo_a7670sa_wifi

[env:lilygo_a7670sa_wifi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM8
upload_port = COM8
build_flags =
  -D TRACKFLOW_BOARD_NAME=\"LILYGO_A7670SA\"
  -D TRACKFLOW_MODEM_RX_PIN=27
  -D TRACKFLOW_MODEM_TX_PIN=26
  -D TRACKFLOW_MODEM_PWRKEY_PIN=4
  -D TRACKFLOW_MODEM_RESET_PIN=5
  -D TRACKFLOW_BOARD_POWERON_PIN=12
  -D TRACKFLOW_MODEM_BAUD=115200

[env:native]
platform = native
test_framework = unity
